# ONT custom startup config.
# This file is sourced by /var/config/ont_startup.sh and /var/config/ont_http_start.sh.
# Keep values shell-safe. Do not use spaces unless quoted.

# Management IP on ONT br0.
ONT_MGMT_ENABLE=1
ONT_MGMT_IF=br0
ONT_MGMT_IP_CIDR=192.168.100.1/24
ONT_MGMT_WAIT_SECONDS=120
ONT_DELETE_BR0_TABLE252=1

# Persistent root-equivalent local user.
#
# ONT_USER_PASS_HASH must be a /var/passwd-compatible password hash, not plaintext.
#
# Generate one on your Linux host, for example:
#   openssl passwd -1 'your-password-here'
#
# Or, if mkpasswd is available:
#   mkpasswd -m md5crypt 'your-password-here'
#
# Paste the full resulting hash below, including the leading "$1$...".
# Example shape:
#   ONT_USER_PASS_HASH='$1$salt$hashedvalue'
#
# The default placeholder intentionally disables user creation.
ONT_USER_ENABLE=1
ONT_USER_NAME=root2
ONT_USER_PASS_HASH='YOUR_PASSWORD_HASH_HERE'
ONT_USER_UID=0
ONT_USER_GID=0
ONT_USER_GECOS=root2
ONT_USER_HOME=/tmp
ONT_USER_SHELL=/bin/sh

# Optional JSON HTTP server.
# Requires /var/config/ont_json_httpd and /var/config/diag_to_json to exist and be executable.
ONT_HTTP_ENABLE=0
ONT_HTTP_SCRIPT=/var/config/ont_http_start.sh
ONT_HTTPD_BIN=/var/config/ont_json_httpd
ONT_JSON_BIN=/var/config/diag_to_json
ONT_HTTP_BIND=192.168.100.1
ONT_HTTP_PORT=8090
ONT_HTTP_TTL=10
ONT_HTTP_TIMEOUT=8
ONT_HTTP_MAX_BYTES=524288
